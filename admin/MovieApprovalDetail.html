<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Movie</title>
    <link rel="stylesheet" href="../assets/Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="Dashboard.html" class="logo-btn hover-glow">
                <img src="../assets/logo.png" alt="Logo" class="logo-img">
            </a>

            <ul class="nav-links">
                <li><a href="Dashboard.html" class="hover-glow" style="color:#228EE5;">Dashboard</a></li>
                <li><a href="Users.html" class="hover-glow">Users</a></li>
                <li><a href="Movies.html" class="hover-glow">Movies</a></li>
                <li><a href="Series.html" class="hover-glow">Series</a></li>
                <li><a href="#" class="hover-glow">Wallet</a></li>
                <li><a href="#" class="hover-glow">Forum</a></li>
            </ul>

            <div class="nav-icons">
                <a href="UserProfile.html" class="icon-btn hover-glow"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </nav>

    <div id="hero" class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="status-badge-pending">Pending Approval</span>

            <h1 id="movieTitle" class="movie-title-large">Loading...</h1>

            <div class="movie-meta">
                <span id="movieYear">0000</span>
                <span id="movieRuntime">0h 0m</span>
                <span id="movieLanguage">EN</span>
            </div>
        </div>
    </div>

    <div class="detail-container">

        <div class="detail-section">
            <h2 class="detail-heading">Description</h2>
            <p id="movieOverview" class="movie-description">Loading...</p>
        </div>

        <div class="detail-section">
            <h2 class="detail-heading">Genres</h2>
            <div id="genreContainer" class="genre-tags"></div>
        </div>

        <div class="detail-section">
            <h2 class="detail-heading">Cast</h2>
            <div id="castContainer" class="cast-scroller"></div>
        </div>

        <div class="admin-action-section">
            <h3 class="admin-action-title">Admin Actions</h3>
            <p style="color:#888; margin-bottom: 20px; font-size:14px;">Review the details above before making a
                decision.</p>

            <div class="admin-btn-container">
                <button class="btn-approve-large" onclick="handleApprove()">
                    <i class="fa-solid fa-check"></i> Approve Movie
                </button>
                <button class="btn-reject-large" onclick="handleReject()">
                    <i class="fa-solid fa-xmark"></i> Reject Movie
                </button>
            </div>
        </div>

    </div>

    <footer>
        <div class="footer-links">
            <a href="#" class="hover-glow">Get the Omni App ></a>
            <a href="#" class="hover-glow">Help ></a>
            <a href="#" class="hover-glow">Site Index ></a>
            <a href="#" class="hover-glow">Omni Pro ></a>
        </div>
        <div class="footer-links secondary">
            <a href="#" class="hover-glow">Omni Developer ></a>
            <a href="#" class="hover-glow">Privacy Policy ></a>
        </div>
    </footer>

    <script>
        const API_KEY = '96878691f0272aade53fca27ac2a739f';
        const IMG_BASE = 'https://image.tmdb.org/t/p/original';
        const IMG_POSTER = 'https://image.tmdb.org/t/p/w500';

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (movieId) {
            fetchDetails(movieId);
            fetchCredits(movieId);
        } else {
            document.getElementById('movieTitle').innerText = "No Movie Selected";
        }

        async function fetchDetails(id) {
            const url = `https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=en-US`;
            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.backdrop_path) {
                    document.getElementById('hero').style.backgroundImage = `url('${IMG_BASE + data.backdrop_path}')`;
                }
                document.getElementById('movieTitle').innerText = data.title;
                document.getElementById('movieOverview').innerText = data.overview;
                document.getElementById('movieYear').innerText = data.release_date.split('-')[0];
                document.getElementById('movieLanguage').innerText = data.original_language.toUpperCase();

                const hours = Math.floor(data.runtime / 60);
                const mins = data.runtime % 60;
                document.getElementById('movieRuntime').innerText = `${hours}h ${mins}m`;

                const genreDiv = document.getElementById('genreContainer');
                data.genres.forEach(g => {
                    const tag = document.createElement('span');
                    tag.classList.add('genre-tag');
                    tag.style.borderColor = '#228EE5';
                    tag.style.color = '#fff';
                    tag.innerText = g.name;
                    genreDiv.appendChild(tag);
                });
            } catch (err) { console.error(err); }
        }

        async function fetchCredits(id) {
            const url = `https://api.themoviedb.org/3/movie/${id}/credits?api_key=${API_KEY}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const castDiv = document.getElementById('castContainer');
                data.cast.slice(0, 8).forEach(person => {
                    if (person.profile_path) {
                        const card = document.createElement('div');
                        card.classList.add('cast-card');
                        card.innerHTML = `
                            <img src="${IMG_POSTER + person.profile_path}" class="cast-img">
                            <div class="cast-name">${person.name}</div>
                        `;
                        castDiv.appendChild(card);
                    }
                });
            } catch (err) { console.error(err); }
        }
        function handleApprove() {
            alert("Movie has been APPROVED successfully.");
            window.location.href = "Approvals.html";
        }

        function handleReject() {
            if (confirm("Are you sure you want to REJECT this movie?")) {
                alert("Movie has been REJECTED.");
                window.location.href = "Approvals.html";
            }
        }
    </script>
    <script src="../assets/theme.js"></script>

</body>

</html>
