<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction - MSP Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- SHARED THEME --- */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
        body {background-color:#020b1f; color:white; overflow-x:hidden;}
        
        /* --- NAVBAR --- */
        .navbar {
            display:flex; align-items:center; justify-content:space-between; 
            padding:15px 5%; position:fixed; top:0; width:100%; z-index:1000; 
            background: rgba(2,11,31,0.95); border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .logo-img {height:35px; cursor: pointer; display: block;}
        .logo-link { text-decoration: none; display: inline-block; }

        /* --- TRANSACTION CONTAINER --- */
        .payment-container {
            padding: 120px 15% 50px;
            display: flex;
            justify-content: center;
        }

        .payment-card {
            background: #0b1326;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #1f2940;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            border-left: 4px solid #e50914;
            padding-left: 15px;
        }

        /* --- METHOD SELECTION --- */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .method-box {
            background: #161d2f;
            border: 2px solid #1f2940;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .method-box img { width: 50px; height: auto; margin-bottom: 10px; border-radius: 5px; }
        .method-box:hover { border-color: #e50914; background: #1c253d; }
        .method-box.active { border-color: #e50914; background: #1c253d; box-shadow: 0 0 15px rgba(229, 9, 20, 0.2); }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        .form-group input {
            width: 100%;
            background: #161d2f;
            border: 1px solid #1f2940;
            color: white;
            padding: 12px 15px;
            border-radius: 6px;
            outline: none;
        }
        .form-group input:focus { border-color: #e50914; }

        .btn-pay {
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-pay:hover { background: #b20710; transform: translateY(-2px); }

        .order-summary {
            background: #161d2f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px dashed #1f2940;
        }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .total-price { color: #e50914; font-weight: bold; font-size: 18px; }

        @media(max-width: 600px) { .payment-methods { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 30px;">
            <a href="index.html" class="logo-link">
                <img src="../assets/logo.png" class="logo-img" alt="MSP">
            </a>
        </div>
        <div style="color: #666;"><i class="fa-solid fa-shield-halved"></i> Secure Checkout</div>
    </nav>

    <main class="payment-container">
        <div class="payment-card">
            <div class="section-title">Upgrade to Premium</div>

            <div class="order-summary">
                <div class="summary-row"><span>Item:</span> <span>Premium Movie Access</span></div>
                <div class="summary-row"><span>Validity:</span> <span>30 Days</span></div>
                <div class="summary-row total-price"><span>Total:</span> <span>500 BDT</span></div>
            </div>

            <label style="display:block; margin-bottom:10px; font-size:14px; color:#aaa;">Select Payment Method:</label>
            <div class="payment-methods">
                <div class="method-box active" onclick="selectMethod(this, 'bKash')">
                    <img src="../assets/bKash.png" alt="bKash">
                    <div>bKash</div>
                </div>
                <div class="method-box" onclick="selectMethod(this, 'Rocket')">
                    <img src="../assets/rocket.png" alt="Rocket">
                    <div>Rocket</div>
                </div>
                <div class="method-box" onclick="selectMethod(this, 'Bank')">
                    <i class="fa-solid fa-building-columns" style="font-size: 35px; margin-bottom: 10px; color:#aaa;"></i>
                    <div>Bank</div>
                </div>
            </div>

            <div class="form-group">
                <label id="phoneLabel">bKash Account Number</label>
                <input type="text" id="accountNumber" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric">
            </div>

            <div class="form-group">
                <label>Transaction ID (TrxID)</label>
                <input type="text" id="trxId" placeholder="Enter the 6-digit ID" maxlength="6" inputmode="numeric">
            </div>

            <button class="btn-pay" onclick="confirmPayment()">Confirm Transaction</button>
            
            <p style="text-align:center; font-size: 12px; color:#666; margin-top:20px;">
                Your data is encrypted and secure. By paying, you agree to our Terms of Use.
            </p>
        </div>
    </main>

    <script>
        // Restrict inputs to numbers only while typing
        const numericInputs = [document.getElementById('accountNumber'), document.getElementById('trxId')];
        numericInputs.forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        });

        function selectMethod(element, method) {
            document.querySelectorAll('.method-box').forEach(box => box.classList.remove('active'));
            element.classList.add('active');

            const label = document.getElementById('phoneLabel');
            if(method === 'Bank') {
                label.innerText = "Bank Account Number / Card Number";
            } else {
                label.innerText = method + " Account Number";
            }
        }

        function confirmPayment() {
            const acc = document.getElementById('accountNumber').value;
            const trx = document.getElementById('trxId').value;

            // Logic: Account Number must be exactly 11 digits
            if(acc.length !== 11) {
                alert("Account Number must be exactly 11 digits!");
                return;
            }

            // Logic: Transaction ID must be exactly 6 digits
            if(trx.length !== 6) {
                alert("Transaction ID must be exactly 6 digits!");
                return;
            }

            alert("Verifying Transaction... Please wait.");
            
            setTimeout(() => {
                // --- GLOBAL GMAIL & STATUS STORAGE ---
                // assume the user logged in with an email saved as 'username'
                const userEmail = localStorage.getItem('username') || "user@gmail.com"; 

                localStorage.setItem('membership', 'premium');
                localStorage.setItem('globalUserEmail', userEmail); 

                alert("Success! Premium Access Granted for: " + userEmail);
                window.location.href = "index.html"; 
            }, 2000);
        }
    </script>
</body>
</html>
