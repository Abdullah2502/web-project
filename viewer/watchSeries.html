<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Series - MSP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
        body { background: #000; color: white; overflow: hidden; }

        .player-layout { display: flex; height: 100vh; width: 100vw; }
        
        /* Main Video */
        .video-side { flex: 3; background: #000; position: relative; }
        #episodeFrame { width: 100%; height: 100%; border: none; }

        /* Sidebar Episode List */
        .episode-side { flex: 1; background: #050b1a; border-left: 1px solid #222; overflow-y: auto; padding: 20px; }
        .episode-side h2 { font-size: 18px; margin-bottom: 20px; color: #e50914; }
        
        .ep-card { 
            display: flex; gap: 15px; background: #111; padding: 10px; 
            border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: 0.3s;
            border: 1px solid transparent;
        }
        .ep-card:hover { background: #1a1a1a; border-color: #e50914; }
        .ep-card.active { background: #e509141a; border-color: #e50914; }
        .ep-card img { width: 100px; height: 60px; border-radius: 4px; object-fit: cover; }
        .ep-info b { font-size: 14px; display: block; }
        .ep-info span { font-size: 12px; color: #888; }

        .back-nav { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 50%; color: white; }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-nav"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="player-layout">
        <div class="video-side">
            <div id="episodeFrame"></div>
        </div>

        <div class="episode-side">
            <h2 id="seriesName">Loading Series...</h2>
            <div id="episodeList">
                </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || "Series";
        const initialVideo = params.get('v') || "Wy1pIFF5imc";
        
        document.getElementById('seriesName').innerText = title;

        // EXAMPLE EPISODE DATA (You can add your YouTube links here)
        const episodes = [
            { id: "Wy1pIFF5imc", title: "Episode 1: The Beginning", thumb: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=200" },
            { id: "b9EkMc79ZSU", title: "Episode 2: The Mystery", thumb: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=201" },
            { id: "mqqft2Cass0", title: "Episode 3: The Dark Path", thumb: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=202" }
        ];

        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('episodeFrame', {
                videoId: initialVideo,
                playerVars: { 'autoplay': 1, 'controls': 1, 'modestbranding': 1 }
            });
        }

        function playEpisode(vidId) {
            player.loadVideoById(vidId);
            renderEpisodes(vidId);
        }

        function renderEpisodes(currentId) {
            const list = document.getElementById('episodeList');
            list.innerHTML = "";
            episodes.forEach((ep, index) => {
                const isActive = ep.id === currentId ? 'active' : '';
                list.innerHTML += `
                    <div class="ep-card ${isActive}" onclick="playEpisode('${ep.id}')">
                        <img src="${ep.thumb}">
                        <div class="ep-info">
                            <b>E${index + 1} - ${ep.title}</b>
                            <span>45 mins</span>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = () => renderEpisodes(initialVideo);
    </script>
</body>
</html>
