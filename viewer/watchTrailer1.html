<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Series - MSP Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-body: #020b1f;
            --bg-nav: rgba(2, 11, 31, 0.95);
            --bg-card: #1f2940;
            --bg-meta: rgba(255, 255, 255, 0.03);
            --text-main: white;
            --text-sub: #ccc;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: #020b1f;
        }

        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-nav: rgba(255, 255, 255, 0.95);
            --bg-card: #ffffff;
            --bg-meta: #eef0f3;
            --text-main: #1c1e21;
            --text-sub: #444;
            --border-color: #ddd;
            --input-bg: #ffffff;
        }

        /* --- MSP CINEMATIC STYLING --- */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        body {background-color: var(--bg-body); color: var(--text-main); overflow-x:hidden; transition: background 0.3s, color 0.3s;}
        
        .navbar {
            display:flex; justify-content: space-between; align-items: center;
            padding:15px 5%; 
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-color);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px 5% 50px; }

        .back-link {
            color: #e50914; text-decoration: none; 
            display: inline-block; margin-bottom: 15px; font-size: 14px;
        }

        #theme-toggle { cursor: pointer; font-size: 18px; transition: 0.3s; }
        #theme-toggle:hover { color: #e50914; }

        .status-badge {
            display: inline-block; padding: 5px 15px; border-radius: 4px;
            font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px;
        }
        .badge-free { background: #2ecc71; color: white; }
        .badge-paid { background: #f1c40f; color: #000; }

        h1 { font-size: 42px; margin-bottom: 20px; font-weight: 700; }

        .player-section { 
            width: 100%; 
            height: 75vh; 
            margin-bottom: 35px; 
            background: #000;
            border-radius: 15px; 
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
            position: relative;
        }
        #ytPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .actions { display: flex; gap: 15px; margin-bottom: 40px; }
        .btn {
            padding: 14px 30px; border-radius: 6px; font-weight: bold;
            cursor: pointer; transition: 0.3s; border: none;
            display: flex; align-items: center; gap: 12px; font-size: 16px;
        }
        .btn-main { background: #e50914; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--border-color); }

        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-bottom: 60px; }
        .info-card h3 { color: #e50914; margin-bottom: 15px; font-size: 22px; text-transform: uppercase; }
        .info-card p { color: var(--text-sub); line-height: 1.8; margin-bottom: 25px; }

        .comment-section { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .rating-box {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; 
            padding: 15px; background: rgba(0,0,0,0.1); border-radius: 8px;
        }
        .stars-input { color: #f1c40f; font-size: 24px; cursor: pointer; }
        .avg-num { font-size: 24px; font-weight: bold; color: #f1c40f; }
        textarea { 
            width: 100%; height: 100px; background: var(--input-bg); border: 1px solid var(--border-color); 
            border-radius: 8px; color: var(--text-main); padding: 15px; margin: 15px 0; resize: none; 
        }
        .comment-list { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .comment-item { padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .comment-item b { color: #e50914; font-size: 14px; }
        .comment-item p { color: var(--text-sub); }

        .suggestion-section { margin-top: 50px; border-top: 1px solid var(--border-color); padding-top: 40px; }
        .suggestion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .suggest-card { background: var(--bg-card); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid var(--border-color); }
        .suggest-card img { width: 100%; height: 300px; object-fit: cover; }
        .suggest-card-body { padding: 15px; text-align: center; font-weight: 600; color: var(--text-main); }

        .meta-info { display: flex; flex-direction: column; gap: 20px; background: var(--bg-meta); padding: 30px; border-radius: 12px; height: fit-content; border: 1px solid var(--border-color);}
        .meta-item span { display: block; color: #888; font-size: 13px; margin-bottom: 10px; }
        
        .person-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .person-item img { 
            width: 50px; height: 50px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #e50914;
            background: #333;
        }
        .person-item b { font-size: 15px; color: var(--text-main); }

        @media(max-width: 992px) {
            .content-grid { grid-template-columns: 1fr; }
            .player-section { height: 45vh; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <img src="../assets/logo.png" style="height:35px; cursor:pointer;" alt="MSP" onclick="location.href='index.html'">
        <i class="fa-solid fa-moon" id="theme-toggle"></i>
    </nav>

    <div class="container">
        <a href="series.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Series Explorer</a>
        <div id="badgeContainer"></div>
        <h1 id="displayTitle">Loading Series...</h1>

        <div class="player-section">
            <div id="ytPlayer"></div>
        </div>

        <div class="actions">
            <button class="btn btn-main" onclick="handleWatchFullSeries()"><i class="fa-solid fa-play"></i> Watch Full Series</button>
            <button class="btn btn-secondary"><i class="fa-solid fa-share-nodes"></i> Share</button>
        </div>

        <div class="content-grid">
            <div class="main-content">
                <div class="info-card">
                    <h3>Series Overview</h3>
                    <p id="seriesDesc">Stream all episodes of this series in Ultra HD 4K. Only on MSP Streaming Platforms.</p>
                </div>

                <div class="comment-section">
                    <h3>Fan Ratings</h3>
                    <div class="rating-box">
                        <div><span>Avg. Rating</span><div class="avg-num" id="avgRating">0.0</div></div>
                        <div style="margin-left: auto; text-align: right;">
                            <span>Your Rate:</span>
                            <div class="stars-input" id="starRatingInput">
                                <i class="fa-regular fa-star" data-val="1"></i>
                                <i class="fa-regular fa-star" data-val="2"></i>
                                <i class="fa-regular fa-star" data-val="3"></i>
                                <i class="fa-regular fa-star" data-val="4"></i>
                                <i class="fa-regular fa-star" data-val="5"></i>
                            </div>
                        </div>
                    </div>
                    <textarea id="commentInput" placeholder="Write your review about the series..."></textarea>
                    <button class="btn btn-main" onclick="submitReview()" style="padding: 10px 20px; font-size: 14px;">Post Review</button>
                    <div class="comment-list" id="commentList"></div>
                </div>
            </div>

            <div class="meta-info">
                <div class="meta-item">
                    <span>Creator</span>
                    <div id="seriesCreator"></div>
                </div>
                <div class="meta-item">
                    <span>Leading Cast</span>
                    <div id="seriesCast"></div>
                </div>
                <div class="meta-item"><span>Format</span><b>Full Series (Seasons Included)</b></div>
            </div>
        </div>

        <div class="suggestion-section">
            <h2 style="margin-bottom: 25px;">More Series Like This</h2>
            <div class="suggestion-grid" id="suggestionGrid"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- THEME TOGGLE LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        const applyTheme = (theme) => {
            if (theme === 'light') {
                body.setAttribute('data-theme', 'light');
                themeToggle.classList.replace('fa-moon', 'fa-sun');
            } else {
                body.removeAttribute('data-theme');
                themeToggle.classList.replace('fa-sun', 'fa-moon');
            }
        };

        themeToggle.addEventListener('click', () => {
            const newTheme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });

        // Initialize Theme
        applyTheme(localStorage.getItem('theme'));

        const params = new URLSearchParams(window.location.search);
        const seriesTitle = params.get('title') || "Series Detail";
        const type = params.get('type') || "free";
        const ytId = params.get('v') || "Wy1pIFF5imc"; 

        const seriesData = {
            "Stranger Things": {
                creator: { name: "The Duffer Brothers", img: "https://image.tmdb.org/t/p/w200/96G2322K8YV1O4EwUoFvK6Tq3Yn.jpg" },
                cast: [
                    { name: "Millie Bobby Brown", img: "https://image.tmdb.org/t/p/w200/h66S9S97zI86p6idX3pXWInC7E.jpg" },
                    { name: "Finn Wolfhard", img: "https://image.tmdb.org/t/p/w200/pe9G5V7684p6idX3pXWInC7E.jpg" }
                ]
            }
        };

        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                videoId: ytId,
                playerVars: { 'autoplay': 1, 'mute': 1, 'controls': 1, 'rel': 0 },
                events: { 'onReady': (e) => e.target.playVideo() }
            });
        }

        function handleWatchFullSeries() {
            const membership = localStorage.getItem('membership');
            const userEmail = localStorage.getItem('globalUserEmail');
            const premiumGmails = ["yourname@gmail.com", "admin@msp.com"];

            const isAuthorized = membership === 'premium' || premiumGmails.includes(userEmail);

            if (type.toLowerCase() === 'paid' && !isAuthorized) {
                alert("Subscription Needed: Please upgrade to Premium to watch this series.");
            } else {
                window.location.href = `watchSeries.html?title=${encodeURIComponent(seriesTitle)}&v=${ytId}`;
            }
        }

        window.onload = () => {
            document.getElementById('displayTitle').innerText = seriesTitle;
            loadReviews();
            loadSuggestions();
            
            const defaultImg = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            const data = seriesData[seriesTitle] || { 
                creator: { name: "Series Creator", img: defaultImg },
                cast: [{ name: "Cast N/A", img: defaultImg }]
            };

            document.getElementById('seriesCreator').innerHTML = `
                <div class="person-item">
                    <img src="${data.creator.img}" onerror="this.src='${defaultImg}'">
                    <b>${data.creator.name}</b>
                </div>`;

            let castHtml = "";
            data.cast.forEach(person => {
                castHtml += `
                <div class="person-item">
                    <img src="${person.img}" onerror="this.src='${defaultImg}'">
                    <b>${person.name}</b>
                </div>`;
            });
            document.getElementById('seriesCast').innerHTML = castHtml;

            const badge = document.createElement('span');
            badge.className = `status-badge badge-${type}`;
            badge.innerText = type;
            document.getElementById('badgeContainer').appendChild(badge);
        };

        let selectedRating = 0;
        const starIcons = document.querySelectorAll('#starRatingInput i');
        starIcons.forEach(s => s.onclick = () => {
            selectedRating = s.getAttribute('data-val');
            starIcons.forEach(i => {
                i.classList.replace('fa-solid', 'fa-regular');
                if(i.getAttribute('data-val') <= selectedRating) i.classList.replace('fa-regular', 'fa-solid');
            });
        });

        function submitReview() {
            const text = document.getElementById('commentInput').value;
            const userEmail = localStorage.getItem('globalUserEmail') || "Guest User";

            if(!text || selectedRating == 0) return alert("Please rate and comment.");
            
            let reviews = JSON.parse(localStorage.getItem('msp_series_reviews')) || [];
            reviews.push({ 
                movie: seriesTitle, 
                stars: selectedRating, 
                comment: text,
                user: userEmail 
            });
            localStorage.setItem('msp_series_reviews', JSON.stringify(reviews));
            location.reload(); 
        }

        function loadReviews() {
            const list = document.getElementById('commentList');
            const avgTag = document.getElementById('avgRating');
            let reviews = (JSON.parse(localStorage.getItem('msp_series_reviews')) || []).filter(r => r.movie === seriesTitle).reverse();
            let sum = 0;
            
            list.innerHTML = "";
            reviews.forEach(r => {
                sum += parseInt(r.stars);
                const reviewer = r.user || "Reviewer";
                list.innerHTML += `<div class="comment-item"><b>${reviewer} (${r.stars}★)</b><p>${r.comment}</p></div>`;
            });
            if(reviews.length > 0) avgTag.innerText = (sum / reviews.length).toFixed(1);
        }

        function loadSuggestions() {
            const grid = document.getElementById('suggestionGrid');
            const suggestions = [
                {title: "The Last of Us", v: "uLtkt8BonwM", img: "https://images.unsplash.com/photo-1616530940355-351fabd9524b?w=400"},
                {title: "Breaking Bad", v: "HhesaQXLuRY", img: "https://images.unsplash.com/photo-1533488765986-dfa2a9939acd?w=400"}
            ];
            suggestions.forEach(m => {
                grid.innerHTML += `
                <div class="suggest-card" onclick="window.location.href='watchTrailer1.html?title=${encodeURIComponent(m.title)}&v=${m.v}&type=free'">
                    <img src="${m.img}">
                    <div class="suggest-card-body">${m.title}</div>
                </div>`;
            });
        }
    </script>
</body>
</html>
