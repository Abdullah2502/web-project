<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies - MSP Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-body: #020b1f;
            --bg-card: #1f2940;
            --bg-nav: linear-gradient(to bottom, rgba(2,11,31,0.95), transparent);
            --text-main: white;
            --text-sub: #ddd;
            --dropdown-bg: #0b1326;
        }

        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-nav: linear-gradient(to bottom, rgba(255,255,255,0.95), transparent);
            --text-main: #1c1e21;
            --text-sub: #444;
            --dropdown-bg: #ffffff;
        }

        /* --- RESET & GLOBAL --- */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
        body {background-color: var(--bg-body); color: var(--text-main); overflow-x:hidden; transition: background 0.3s, color 0.3s;}
        a {text-decoration:none; color:inherit;}

        /* --- NAVBAR --- */
        .navbar {
            display:flex; 
            align-items:center; 
            justify-content:space-between; 
            padding:15px 5%; 
            position:fixed; 
            top:0; 
            width:100%; 
            z-index:1000; 
            background: var(--bg-nav);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: background 0.3s;
        }
        .nav-links {display:flex; list-style:none; gap:25px;}
        .nav-links a {color: var(--text-sub); font-weight:500; font-size:15px;}
        .nav-links a.active {color:#e50914;}
        .nav-icons {display:flex; gap:20px; font-size:18px; align-items: center; color:#ccc;}
        .logo-img {height:35px;}

        /* --- SEARCH BAR CSS --- */
        .search-container { display: flex; align-items: center; position: relative; }
        .search-input {
            width: 0; opacity: 0; background: rgba(255,255,255,0.1); border: 1px solid #444;
            color: var(--text-main); padding: 5px 0; border-radius: 4px; outline: none;
            transition: all 0.4s ease; font-size: 14px;
        }
        .search-input.active { width: 180px; opacity: 1; padding: 5px 10px; margin-right: 10px; }
        .fa-magnifying-glass { cursor: pointer; transition: 0.3s; }
        .fa-magnifying-glass:hover { color: #e50914; }

        /* --- USER ICON & LOGOUT CSS --- */
        #user-display-name { font-size: 14px; color: #e50914; font-weight: 600; cursor: pointer; }
        .user-container { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logout-dropdown {
            position: absolute; top: 40px; right: 0; background: var(--dropdown-bg);
            border: 1px solid var(--bg-card); border-radius: 4px; display: none;
            z-index: 1001; overflow: hidden;
            min-width: 140px;
        }
        .logout-dropdown button {
            background: none; border: none; color: var(--text-main); padding: 10px 20px;
            cursor: pointer; width: 100%; text-align: left; font-size: 14px; transition: 0.3s;
        }
        .logout-dropdown button:hover { background: #e50914; color: white; }

        /* THEME TOGGLE */
        #theme-toggle { cursor: pointer; transition: 0.3s; }
        #theme-toggle:hover { color: #e50914; }

        /* --- MOVIE EXPLORER LAYOUT --- */
        .explorer-container {
            padding: 120px 5% 50px;
            min-height: 80vh;
        }
        .page-header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-header h2 { font-size: 28px; font-weight: 600; }
        
        .filter-tabs { display: flex; gap: 15px; }
        .tab {
            padding: 8px 24px;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .tab.active, .tab:hover {
            background: #e50914;
            color: white;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
        }

        /* --- MOVIE GRID --- */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .card { 
            position: relative;
            border-radius: 12px; 
            overflow: hidden; 
            background: var(--bg-card); 
            transition: 0.3s; 
            cursor: pointer; 
            border: 1px solid var(--bg-card); 
            aspect-ratio: 2/3;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card:hover { transform: translateY(-10px); border-color: #e50914; }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 2;
        }
        .badge-free { background: #2ecc71; color: white; }
        .badge-paid { background: #f1c40f; color: #000; }

        .card-info {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 25px 10px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            text-align: center;
            color: white; /* Keep text white over dark gradient regardless of theme */
        }
        .movie-name { font-size: 14px; font-weight: 500; }

        /* --- FOOTER --- */
        .footer { background-color: var(--bg-body); padding: 50px 5% 20px; border-top: 1px solid var(--bg-card); margin-top: 80px; }
        .footer-container { max-width: 1000px; margin: 0 auto; }
        .footer-socials { margin-bottom: 25px; }
        .footer-socials a { font-size: 24px; margin-right: 25px; color: var(--text-main); transition: 0.3s; }
        .footer-socials a:hover { color: #e50914; }
        .footer-links ul { display: grid; grid-template-columns: repeat(4, 1fr); list-style: none; gap: 15px; }
        .footer-links a { color: #808080; font-size: 13px; transition: 0.3s; }
        .footer-links a:hover { color: var(--text-main); text-decoration: underline; }
        .copyright { color: #808080; font-size: 11px; margin-top: 30px; }

        @media(max-width:768px){
            .nav-links { display:none; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .footer-links ul { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 30px;"><img src="../assets/logo.png" class="logo-img" alt="MSP"></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="movie.html" class="active">Movies</a></li>
            <li><a href="series.html">Series</a></li>
            <li><a href="forum.html">Forum</a></li>
            <li><a href="subscription.html">Subscribe</a></li>
        </ul>
        <div class="nav-icons">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search..." id="searchInput">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
            </div>
            
            <i class="fa-regular fa-bell"></i>
            
            <div class="user-container" id="userArea">
                <span id="user-display-name"></span>
                <i class="fa-solid fa-circle-user"></i>
                <div class="logout-dropdown" id="logoutDropdown">
                    <button onclick="window.location.href='userDashboard.html'">Dashboard</button>
                    <button id="logoutBtn">Log Out</button>
                </div>
            </div>
            <i class="fa-solid fa-moon" id="theme-toggle"></i>
        </div>
    </nav>

    <main class="explorer-container">
        <div class="page-header">
            <h2>Explore Movies</h2>
            <div class="filter-tabs">
                <div class="tab active" onclick="filterMovies('all')">All</div>
                <div class="tab" onclick="filterMovies('free')">Free</div>
                <div class="tab" onclick="filterMovies('paid')">Premium</div>
            </div>
        </div>

        <div class="movie-grid" id="movieGrid">
            <div class="card movie-item paid" onclick="goToPlayer('The Dark Knight', 'videos/batman.mp4', 'paid')">
                <span class="badge badge-paid">Premium</span>
                <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=500&q=80">
                <div class="card-info"><div class="movie-name">The Dark Knight</div></div>
            </div>

            <div class="card movie-item free" onclick="goToPlayer('Interstellar', 'videos/interstellar.mp4', 'free')">
                <span class="badge badge-free">Free</span>
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80">
                <div class="card-info"><div class="movie-name">Interstellar</div></div>
            </div>

            <div class="card movie-item paid" onclick="goToPlayer('The Witcher', 'videos/witcher.mp4', 'paid')">
                <span class="badge badge-paid">Premium</span>
                <img src="https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?auto=format&fit=crop&w=500&q=80">
                <div class="card-info"><div class="movie-name">The Witcher</div></div>
            </div>

            <div class="card movie-item free" onclick="goToPlayer('Inception', 'videos/inception.mp4', 'free')">
                <span class="badge badge-free">Free</span>
                <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&w=500&q=80">
                <div class="card-info"><div class="movie-name">Inception</div></div>
            </div>

            <div class="card movie-item paid" onclick="goToPlayer('The Batman', 'videos/the_batman.mp4', 'paid')">
                <span class="badge badge-paid">Premium</span>
                <img src="https://images.unsplash.com/photo-1531259683007-016a7b628fc3?auto=format&fit=crop&w=500&q=80">
                <div class="card-info"><div class="movie-name">The Batman</div></div>
            </div>

            <div class="card movie-item free" onclick="goToPlayer('Dune', 'videos/dune.mp4', 'free')">
                <span class="badge badge-free">Free</span>
                <img src="https://images.unsplash.com/photo-1621955964441-c173e01c1151?auto=format&fit=crop&w=500&q=80">
                <div class="card-info"><div class="movie-name">Dune</div></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-socials">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
            <div class="footer-links">
                <ul>
                    <li><a href="#">Help Center</a></li>
                    <li><a href="#">Privacy</a></li>
                    <li><a href="#">Contact Us</a></li>
                    <li><a href="#">Jobs</a></li>
                </ul>
            </div>
            <p class="copyright">© 1997-2026 MSP - Movie Streaming Platform, Inc.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- THEME TOGGLE LOGIC ---
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;

            themeToggle.addEventListener('click', () => {
                if (body.getAttribute('data-theme') === 'light') {
                    body.removeAttribute('data-theme');
                    themeToggle.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('theme', 'dark');
                } else {
                    body.setAttribute('data-theme', 'light');
                    themeToggle.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('theme', 'light');
                }
            });

            // Load Saved Theme
            if(localStorage.getItem('theme') === 'light') {
                body.setAttribute('data-theme', 'light');
                themeToggle.classList.replace('fa-moon', 'fa-sun');
            }

            // 1. AUTH & LOGOUT LOGIC
            const username = localStorage.getItem('username');
            const globalEmail = localStorage.getItem('globalUserEmail');
            const membership = localStorage.getItem('membership');

            const userArea = document.getElementById('userArea');
            const userDisplayName = document.getElementById('user-display-name');
            const logoutDropdown = document.getElementById('logoutDropdown');
            const logoutBtn = document.getElementById('logoutBtn');

            const activeUser = globalEmail || username;

            if (activeUser) {
                userDisplayName.textContent = activeUser;
                
                if (membership === 'premium') {
                    userDisplayName.style.color = "#FFD700";
                    userDisplayName.innerHTML += ' <i class="fa-solid fa-crown" style="font-size: 10px; margin-left: 4px;"></i>';
                }

                userArea.addEventListener('click', function(e) {
                    e.stopPropagation();
                    logoutDropdown.style.display = (logoutDropdown.style.display === 'block') ? 'none' : 'block';
                });

                logoutBtn.addEventListener('click', function() {
                    localStorage.removeItem('username');
                    localStorage.removeItem('globalUserEmail');
                    localStorage.removeItem('membership');
                    window.location.href = 'index.html';
                });
            } else {
                userArea.addEventListener('click', function() {
                    window.location.href = 'auth.html';
                });
            }

            // Close dropdown/search when clicking outside
            document.addEventListener('click', function() {
                logoutDropdown.style.display = 'none';
                document.getElementById('searchInput').classList.remove('active');
            });

            // 2. SEARCH ICON TOGGLE
            const searchIcon = document.getElementById('searchIcon');
            const searchInput = document.getElementById('searchInput');

            searchIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                searchInput.classList.toggle('active');
                if (searchInput.classList.contains('active')) {
                    searchInput.focus();
                }
            });

            searchInput.addEventListener('click', (e) => e.stopPropagation());
        });

        // PLAYER REDIRECT
        function goToPlayer(name, source, type) {
            const url = `watchTrailer.html?title=${encodeURIComponent(name)}&src=${encodeURIComponent(source)}&type=${encodeURIComponent(type)}`;
            window.location.href = url;
        }

        // FILTER LOGIC
        function filterMovies(type) {
            const movies = document.querySelectorAll('.movie-item');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(tab => {
                tab.classList.remove('active');
                if(tab.textContent.toLowerCase() === type || (type === 'paid' && tab.textContent === 'Premium')) {
                    tab.classList.add('active');
                }
                if(type === 'all' && tab.textContent === 'All') tab.classList.add('active');
            });

            movies.forEach(movie => {
                if (type === 'all' || movie.classList.contains(type)) {
                    movie.style.display = 'block';
                } else {
                    movie.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
