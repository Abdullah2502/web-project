<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - MSP Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        body { background-color:#020b1f; color:white; }

        .navbar {
            display:flex; justify-content: space-between; align-items: center;
            padding:15px 5%; background: rgba(2,11,31,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 5%; }

        /* Stats Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; margin-bottom: 50px; 
        }
        .stat-card {
            background: #1f2940; padding: 30px; border-radius: 15px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card i { font-size: 40px; color: #e50914; margin-bottom: 15px; }
        .stat-card h2 { font-size: 32px; margin-bottom: 5px; }
        .stat-card p { color: #888; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }

        /* Membership Badge */
        .status-tag {
            padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold;
        }
        .status-free { background: #2ecc71; color: white; }
        .status-premium { background: #f1c40f; color: black; }

        /* Resume Section */
        .section-title { margin-bottom: 25px; font-size: 24px; border-left: 4px solid #e50914; padding-left: 15px; }
        
        .resume-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .resume-card {
            background: #1f2940; border-radius: 10px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .resume-info b { display: block; font-size: 18px; margin-bottom: 5px; }
        .resume-info span { color: #aaa; font-size: 13px; }
        .play-btn { 
            width: 45px; height: 45px; background: #e50914; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: white;
            text-decoration: none; transition: 0.3s;
        }
        .play-btn:hover { transform: scale(1.1); }

        .no-data { color: #555; font-style: italic; }
        
        .btn-logout {
            background: rgba(255,255,255,0.1); color: white; border: none;
            padding: 8px 20px; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <img src="logo.png" style="height:30px;" alt="MSP">
        <button class="btn-logout" onclick="location.href='index.html'">Back to Home</button>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 30px;">Welcome Back, <span id="userEmail">Guest</span></h1>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-clock"></i>
                <h2 id="totalMinutes">0</h2>
                <p>Minutes Watched</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-crown"></i>
                <div style="margin-top: 10px;">
                    <span id="membershipStatus" class="status-tag status-free">Free Tier</span>
                </div>
                <p style="margin-top: 15px;">Account Level</p>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-film"></i>
                <h2 id="moviesStarted">0</h2>
                <p>Movies in Progress</p>
            </div>
        </div>

        <h3 class="section-title">Continue Watching</h3>
        <div class="resume-list" id="resumeList">
            </div>
    </div>

    <script>
        window.onload = () => {
            // 1. Load User Info
            const email = localStorage.getItem('globalUserEmail') || "Guest User";
            document.getElementById('userEmail').innerText = email;

            // 2. Load Membership Status
            const membership = localStorage.getItem('membership') || "free";
            const statusTag = document.getElementById('membershipStatus');
            statusTag.innerText = membership.toUpperCase();
            statusTag.className = `status-tag status-${membership}`;

            // 3. Load Total Watch Time
            const totalMins = localStorage.getItem('total_minutes_watched') || "0";
            document.getElementById('totalMinutes').innerText = Math.floor(totalMins);

            // 4. Load "Continue Watching" items
            const resumeList = document.getElementById('resumeList');
            let startedCount = 0;

            // Loop through localStorage to find keys starting with "progress_"
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith("progress_")) {
                    startedCount++;
                    const movieTitle = key.replace("progress_", "");
                    const timeInSeconds = parseFloat(localStorage.getItem(key));
                    const minutes = Math.floor(timeInSeconds / 60);
                    const seconds = Math.floor(timeInSeconds % 60);

                    resumeList.innerHTML += `
                        <div class="resume-card">
                            <div class="resume-info">
                                <b>${movieTitle}</b>
                                <span>Left off at ${minutes}:${seconds < 10 ? '0'+seconds : seconds}</span>
                            </div>
                            <a href="watchMovie.html?title=${encodeURIComponent(movieTitle)}" class="play-btn">
                                <i class="fa-solid fa-play"></i>
                            </a>
                        </div>
                    `;
                }
            }

            document.getElementById('moviesStarted').innerText = startedCount;

            if (startedCount === 0) {
                resumeList.innerHTML = "<p class='no-data'>No movies in progress. Start watching to see them here!</p>";
            }
        };
    </script>
</body>
</html>
