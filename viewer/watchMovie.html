<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching - MSP Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
        body { background-color:#000; color:white; overflow:hidden; }
        .video-container { width: 100vw; height: 100vh; position: relative; }
        #fullPlayer { width: 100%; height: 100%; border: none; }
        .overlay-controls {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            display: flex; align-items: center; gap: 20px;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 50px;
        }
        .back-btn { color: white; text-decoration: none; font-size: 18px; }
        .tracking-status {
            position: absolute; bottom: 20px; right: 20px;
            font-size: 12px; color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="overlay-controls">
            <a href="movie.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <span id="movieTitleDisplay">Loading Movie...</span>
        </div>
        <div id="fullPlayer"></div>
        <div class="tracking-status" id="trackStatus">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Tracking Watch Time...
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const movieTitle = params.get('title') || "Unknown Movie";
        const ytId = params.get('v') || "";

        document.getElementById('movieTitleDisplay').innerText = movieTitle;

        let player;
        let watchInterval;
        let hasResumed = false; // Flag to prevent repeated seeking

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('fullPlayer', {
                videoId: ytId,
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 1, 
                    'rel': 0, 
                    'modestbranding': 1 
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // Check for progress when the video starts playing
            if (event.data == YT.PlayerState.PLAYING) {
                
                // --- RESUME LOGIC ---
                if (!hasResumed) {
                    const savedProgress = localStorage.getItem(`progress_${movieTitle}`);
                    if (savedProgress) {
                        const resumeTime = parseFloat(savedProgress);
                        // Only seek if the user was more than 5 seconds in
                        if(resumeTime > 5) {
                            player.seekTo(resumeTime, true);
                            console.log("Resumed to: " + resumeTime);
                        }
                    }
                    hasResumed = true; // Set to true so it doesn't seek again if user pauses/plays
                }

                // Start tracking interval (every 5 seconds for better accuracy)
                if (!watchInterval) {
                    watchInterval = setInterval(updateWatchProgress, 5000);
                }
            } else {
                clearInterval(watchInterval);
                watchInterval = null;
            }
        }

        function updateWatchProgress() {
            if (player && player.getCurrentTime) {
                const currentTime = player.getCurrentTime();
                
                // 1. Save specific movie progress for Resuming
                localStorage.setItem(`progress_${movieTitle}`, currentTime);

                // 2. Update Global Watch Time (in minutes)
                let totalWatched = parseFloat(localStorage.getItem('total_minutes_watched')) || 0;
                totalWatched += (5 / 60); // Adding 5 seconds converted to minutes
                localStorage.setItem('total_minutes_watched', totalWatched.toFixed(2));

                // Visual Status
                const status = document.getElementById('trackStatus');
                status.innerHTML = `<i class="fa-solid fa-check"></i> Progress Synced`;
                setTimeout(() => {
                    status.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Tracking Watch Time...`;
                }, 1500);
            }
        }
    </script>
</body>
</html>
