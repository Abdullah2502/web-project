<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Registration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Lato', sans-serif; }

  body {
    background: radial-gradient(circle at top, #0d1b3d 0%, #050914 60%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
  }

  .prodReg-container {
    background: rgba(10, 20, 40, 0.95);
    padding: 50px 40px;
    border-radius: 16px;
    width: 100%;
    max-width: 700px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    overflow-y: auto; /* prevent overflow */
    max-height: 90vh; /* modal stays inside viewport */
  }

  h2 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 32px;
    color: #ffffff;
    text-align: center;
  }

  .prodReg-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
  }

  .input-group.full-width {
    grid-column: 1 / -1;
  }

  .prodReg-form label {
    font-size: 16px;
    margin-bottom: 6px;
    opacity: 0.85;
  }

  .prodReg-form input,
  .prodReg-form textarea {
    width: 100%;
    padding: 18px 20px;
    border-radius: 12px;
    border: 1px solid #2a5cff;
    background: #0f172a;
    color: white;
    font-size: 16px;
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .prodReg-form input:focus,
  .prodReg-form textarea:focus {
    border-color: #4da3ff;
    background: #111a33;
  }

  .prodReg-form textarea {
    resize: vertical;
    min-height: 120px;
  }

  .prodReg-btn {
    padding: 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    background: #2a9bff;
    color: white;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    margin-top: 12px;
  }

  .prodReg-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(42,155,255,0.4);
    background: #4da3ff;
  }

  .prodReg-btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }

  .prodReg-note {
    font-size: 14px;
    opacity: 0.75;
    margin-top: 6px;
    text-align: right;
  }

  @media (max-width: 640px) {
    .grid-2 {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .prodReg-container {
      padding: 30px 20px;
      max-width: 95%;
    }
    h2 { font-size: 28px; }
    .prodReg-form input, .prodReg-form textarea { padding: 14px 16px; font-size: 14px; }
    .prodReg-btn { font-size: 16px; padding: 16px; }
  }
</style>
</head>
<body>

<div class="prodReg-container">
  <h2>Producer Registration</h2>
  <form class="prodReg-form" onsubmit="handleRegistration(event)">
    
    <div class="grid-2">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="fullName" placeholder="John Smith" required>
      </div>
      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="john_smith" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>Phone</label>
        <input type="text" name="phone" placeholder="+1 (555) 000-0000" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>Location</label>
        <input type="text" name="location" placeholder="New York, USA" required>
      </div>
      <div class="input-group">
        <label>Website</label>
        <input type="text" name="website" placeholder="https://www.portfolio.com">
      </div>
    </div>

    <div class="input-group full-width">
      <label>About Applicant</label>
      <textarea name="about" placeholder="Write a brief description about yourself..." required></textarea>
    </div>

    <a href="producerPage.html" type="submit" class="prodReg-btn" style="text-align: center; text-decoration: none;">Register</a>
  </form>
</div>

<script>
  function handleRegistration(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
      fullName: form.fullName.value,
      username: form.username.value,
      email: form.email.value,
      phone: form.phone.value,
      location: form.location.value,
      website: form.website.value,
      about: form.about.value,
      verificationStatus: "Pending"
    };
    console.log("Registered Producer Data:", data);
    alert("Registration successful! Verification is Pending.");
    form.reset();
  }
</script>

</body>
</html>
