<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - MSP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(rgba(2, 11, 31, 0.8), rgba(2, 11, 31, 0.8)), 
                        url('https://images.unsplash.com/photo-1574267432553-4b4628081c31?q=80&w=2000');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 5%;
            z-index: 100;
        }

        .auth-container {
            background: rgba(0, 0, 0, 0.75);
            padding: 60px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 { font-size: 32px; margin-bottom: 28px; font-weight: 600; }
        .input-group { margin-bottom: 16px; position: relative; }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus { background: #454545; }

        .btn-auth {
            width: 100%;
            padding: 16px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            transition: 0.3s;
        }
        .btn-auth:hover { background: #ff0a16; }

        .auth-footer {
            margin-top: 20px;
            color: #b3b3b3;
            font-size: 15px;
        }
        .auth-footer span {
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        .auth-footer span:hover { text-decoration: underline; }

        .help-flex {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #b3b3b3;
        }

        #register-form { display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html"><img src="logo.png" style="height:40px;" alt="MSP"></a>
    </nav>

    <div class="auth-container">
        <div id="login-form">
            <h2>Sign In</h2>
            <form onsubmit="handleAuth(event)">
                <div class="input-group">
                    <input type="email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-auth">Sign In</button>
                <div class="help-flex">
                    <label><input type="checkbox" checked> Remember me</label>
                    <a href="#">Need help?</a>
                </div>
            </form>
            <div class="auth-footer">
                New to MSP? <span onclick="toggleAuth()">Sign up now.</span>
            </div>
        </div>

        <div id="register-form">
            <h2>Sign Up</h2>
            <form onsubmit="handleAuth(event)">
                <div class="input-group">
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Create Password" required>
                </div>
                <button type="submit" class="btn-auth">Get Started</button>
            </form>
            <div class="auth-footer">
                Already have an account? <span onclick="toggleAuth()">Sign in.</span>
            </div>
        </div>
    </div>

   <script>
        function toggleAuth() {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            
            if (login.style.display === "none") {
                login.style.display = "block";
                register.style.display = "none";
            } else {
                login.style.display = "none";
                register.style.display = "block";
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            
            const isRegister = document.getElementById('register-form').style.display === "block";
            let displayName = "";

            if (isRegister) {
                displayName = e.target.querySelector('input[type="text"]').value;
            } else {
                const email = e.target.querySelector('input[type="email"]').value;
                displayName = email.split('@')[0]; 
            }

            localStorage.setItem('username', displayName);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
